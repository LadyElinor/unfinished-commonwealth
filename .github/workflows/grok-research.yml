name: Grok-inspired research regressions
on:
  push:
    branches:
      - research/grok-engineering-gates-20261111
  pull_request:
  workflow_dispatch:
jobs:
  research-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline reference regressions
        run: python -m unittest tests.test_grok_integration tests.test_grok_orbits -v
