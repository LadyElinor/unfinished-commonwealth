name: Grok-inspired research regressions
on:
  push:
    branches:
      - research/grok-engineering-gates-20261111
  pull_request:
  workflow_dispatch:
jobs:
  research-fixtures:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline reference regressions
        run: python -m unittest discover -s tests -p 'test_grok_*.py' -v
  native-acs-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned research-only artifacts
        run: |
          python -m pip install --only-binary=:all: --no-deps --require-hashes -r research/acs_comparison/wheel-requirements.txt
          curl -fsSL --retry 2 https://github.com/open-policy-agent/opa/releases/download/v1.4.2/opa_linux_amd64_static -o "$RUNNER_TEMP/opa"
          echo "2c0ccdbbe0b8e2a5d12d9c42d92f1f34f494ffb32d1f3c4ddc36101be637d66f  $RUNNER_TEMP/opa" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/opa"
      - name: Compare native decisions and observe recovered SQLite effects
        run: ACS_OPA_PATH="$RUNNER_TEMP/opa" python -m research.acs_comparison
