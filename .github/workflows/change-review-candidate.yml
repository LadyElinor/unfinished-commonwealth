name: Verify change review candidate

on:
  push:
    branches: [release/change-review-rc3]
  pull_request:
    branches: [release/0.1.4rc2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-service:
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/release/change-review-rc3') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
       github.head_ref == 'release/change-review-rc3')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE: .local/change-review-evidence
      DISTRIBUTIONS: .local/change-review-artifacts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Record checked-out revision
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD > "$EVIDENCE/source-commit.txt"
      - name: Verify and build the sdist and wheel
        run: |
          python -m pip install 'setuptools==80.9.0' 'wheel==0.45.1'
          python scripts/package.py "$DISTRIBUTIONS"
      - name: Exercise the installed service across Linux UIDs
        run: |
          envdir="$(mktemp -d /tmp/commonwealth-change-review.XXXXXXXX)"
          trap 'rm -rf -- "$envdir"' EXIT
          chmod 0755 "$envdir"
          python -m venv "$envdir/venv"
          "$envdir/venv/bin/python" -m pip install --no-index --no-deps "$DISTRIBUTIONS"/*.whl
          sudo "$envdir/venv/bin/python" -I scripts/change_review_acceptance.py --run "$EVIDENCE/uid-acceptance.json"
      - name: Exercise the packaged unit under systemd
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_RUN_ID \
            "$(command -v python)" -I scripts/change_review_systemd.py \
            --github-hosted-disposable --wheel "$DISTRIBUTIONS"/*.whl --receipt "$EVIDENCE/systemd-acceptance.json"
      - name: Hash the retained artifacts and receipts
        run: |
          cd .local
          sha256sum change-review-artifacts/*.whl change-review-artifacts/*.tar.gz change-review-artifacts/package-verification.json \
            change-review-evidence/source-commit.txt change-review-evidence/uid-acceptance.json change-review-evidence/systemd-acceptance.json \
            > change-review-evidence/SHA256SUMS
      - name: Retain exact-head distributions and available acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commonwealth-change-review-rc3-${{ env.CANDIDATE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .local/change-review-artifacts/*.whl
            .local/change-review-artifacts/*.tar.gz
            .local/change-review-artifacts/package-verification.json
            .local/change-review-evidence/
