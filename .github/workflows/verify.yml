name: Verify workshop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
            no_skips: --require-no-skips
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The candidate artifact job builds the contributor's exact revision.
          # Other PR jobs exercise GitHub's prospective merge.
          ref: ${{ matrix.no_skips && github.head_ref == 'release/0.1.4rc2' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Enable optional Assembly import and cross-language checks
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m pip install "cryptography>=41" "jsonschema>=4.18"
          python -c "from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey"
          node --version
      - name: Behavioral and integrity checks
        run: python scripts/verify.py --report .local/verification.json ${{ matrix.no_skips }}
      - name: Retain actual verification coverage in job log
        if: always()
        run: python -c "from pathlib import Path; p=Path('.local/verification.json'); print(p.read_text() if p.exists() else 'No verification receipt was produced')"
      - name: Reproduce workshop and comparison
        run: python scripts/reproduce.py .local/ci-reproduction
      - name: Reproduce separate deterministic contract harness
        run: python -m commonwealth.study_v1 run .local/ci-study-v1
      - name: Reproduce charged comparison and independently check published numbers
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          python -m commonwealth.measurement_v1 run .local/ci-charged --fixture-agent examples/agent_profile_v1/python_agent.py
          cmp .local/ci-charged/results.json examples/charged-workshop-results.json
          cmp .local/ci-study-v1/summary.json examples/study-v1-summary.json
          node scripts/audit_measurement.mjs study .local/ci-study-v1/journals .local/ci-study-v1/results.json
          node scripts/audit_measurement.mjs assembly examples/assembly_v1/public_record.json
          python -m commonwealth.measurement_v1 neighbor .local/ci-neighbor
          cmp .local/ci-neighbor/results.json examples/neighbor-timing-results.json
      - name: Reproduce procedural review traces
        run: python -m commonwealth.procedure_v1 run .local/ci-procedure-v1
      - name: Reproduce decision authority and evidence routing comparison
        run: |
          python -m commonwealth.coordination_v1 run .local/ci-coordination-v1
          python -c "from pathlib import Path; assert Path('.local/ci-coordination-v1/results.json').read_bytes() == Path('examples/coordination-v1-results.json').read_bytes()"
          python -m commonwealth.coordination_v1 replay .local/ci-coordination-v1/episodes.jsonl --line 672
      - name: Reproduce collective authority and retaliation comparison
        run: |
          python -m commonwealth.coordination_v2 run .local/ci-coordination-v2
          python -c "from pathlib import Path; assert Path('.local/ci-coordination-v2/results.json').read_bytes() == Path('examples/coordination-v2-results.json').read_bytes()"
          python -m commonwealth.coordination_v2 replay .local/ci-coordination-v2/episodes.jsonl --line 2016
      - name: Reproduce uncertain evidence and selective resource denial
        run: |
          python -m commonwealth.uncertainty_v1 run .local/ci-uncertainty-v1
          python -c "from pathlib import Path; assert Path('.local/ci-uncertainty-v1/results.json').read_bytes() == Path('examples/uncertainty-v1-results.json').read_bytes()"
          python -m commonwealth.uncertainty_v1 replay .local/ci-uncertainty-v1/episodes.jsonl --line 3840
      - name: Independently recount uncertain-evidence traces
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: node scripts/audit_uncertainty.mjs .local/ci-uncertainty-v1/episodes.jsonl .local/ci-uncertainty-v1/results.json
      - name: Reproduce advisory fraud-discernment study
        run: python -m commonwealth.discernment_v1 run .local/ci-discernment-v1
      - name: Reproduce commitment and issuer-integrity study
        run: python -m commonwealth.integrity_v1 run .local/ci-integrity-v1
      - name: Reproduce balanced review and reconsideration traces
        run: python -m commonwealth.review_v1 run .local/ci-review-v1
      - name: Reproduce authority, language and correction boundaries
        run: python -m commonwealth.authority_v1 run .local/ci-authority-v1
      - name: Verify local participant transport
        run: python -m commonwealth.participant_v1 demo
      - name: Prepare package build tools
        run: python -m pip install "setuptools>=68" wheel
      - name: Verify source archive and clean wheel installation
        run: python scripts/package.py .local/ci-release
      - name: Retain verified candidate distributions and receipts
        if: matrix.no_skips && (github.ref == 'refs/heads/release/0.1.4rc2' || github.head_ref == 'release/0.1.4rc2')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: commonwealth-0.1.4rc2-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            .local/verification.json
            .local/ci-release/*.whl
            .local/ci-release/*.tar.gz
            .local/ci-release/package-verification.json
            .local/ci-release/client-only/*.whl
            .local/ci-release/client-only/*.tar.gz
            .local/ci-release/client-only/client-package-verification.json

  uid-isolation:
    # Opt-in disposable runner only. No account/service/firewall changes.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe proposal boundary across three unprivileged UIDs
        run: sudo "$(command -v python)" scripts/uid_isolation.py --run .local/uid-isolation.json
      - name: Preserve sanitized observation report in job log
        if: always()
        run: cat .local/uid-isolation.json
