name: CORTAC maintenance applicability

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: commonwealth
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: LadyElinor/CORTAC
          ref: ea7a72456e00bd2b80aa4ccd9ae97262aedc3562
          path: cortac
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test applicability, supplied review and old/new verifier outcomes
        run: python commonwealth/scripts/maintenance_pilot.py cortac commonwealth/.local/maintenance-pilot
