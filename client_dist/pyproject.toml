[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unfinished-commonwealth-client"
version = "2.0.0"
description = "Standalone proposal-only local research client; no keeper or evaluator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
commonwealth-client = "commonwealth_client_v2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["commonwealth_client_v2"]
namespaces = false

[tool.setuptools.package-data]
commonwealth_client_v2 = ["LICENSE.txt"]
