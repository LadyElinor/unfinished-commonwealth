[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unfinished-commonwealth"
version = "0.1.1"
description = "A persistent research workshop for cooperative agents, consequences, and institutional memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
commonwealth = "commonwealth.cli:main"

[tool.setuptools.packages.find]
include = ["commonwealth*"]

[tool.setuptools.package-data]
commonwealth = ["data/*.json"]
